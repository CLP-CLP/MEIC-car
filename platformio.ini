; ============================================================================
;  PlatformIO 工程配置 —— STM32F103C8T6 (Blue Pill) 标准裸机工程
;  framework = stm32cube (STM32Cube HAL + CMSIS)，目录结构参照 STM32CubeMX
;
;  常用命令:
;    pio run                     编译
;    pio run -t upload           通过 ST-Link 下载
;    pio device monitor          打开串口监视器 (115200)
;    pio run -t clean            清理
;
;  文档: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
default_envs = bluepill_f103c8_128k
description = STM32F103C8T6 bare-metal firmware based on STM32Cube HAL + CMSIS

; ----------------------------------------------------------------------------
;  公共配置：所有环境共享
; ----------------------------------------------------------------------------
[env]
platform  = ststm32
framework = stm32cube

; 固定使用 xPack GCC 10.3.1，而不是 ststm32 平台默认的 GCC 7.2.1
; （平台对 toolchain-gccarmnoneeabi 的默认约束是 >=1.60301.0,<1.80000.0，
;   会把 10.x 排除在外，必须显式指定）
platform_packages =
    toolchain-gccarmnoneeabi@~1.100301.220327

; 使用本工程 include/stm32f1xx_hal_conf.h 里的 HAL 裁剪配置，
; 而不是框架包中的默认“全模块打开”配置
board_build.stm32cube.custom_config_header = yes

; --- 下载 / 调试：SWD，SWCLK=PA14，SWDIO=PA13，GND，3V3 ---------------------
; 山寨 ST-Link 若报 "unknown device ID / CPUTAPID" 错误，取消注释后重试：
;upload_flags =
;    -c
;    set CPUTAPID 0
upload_protocol = stlink
debug_tool      = stlink

; --- 串口监视器：USART1，PA9=TX，PA10=RX ------------------------------------
monitor_speed   = 115200
monitor_filters = direct

; --- 编译选项 ---------------------------------------------------------------
; 全局标志（同样作用于框架里的 HAL 源码）
;   注意：-Wl,... 会被 PlatformIO 自动归入链接阶段，不会污染编译命令
build_flags =
    -std=gnu11
    -Wl,--print-memory-usage

; 仅作用于 src/ 下本工程代码的严格告警，避免框架源码产生噪音
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -fno-common

; 需要 printf 支持浮点数 (%f) 时取消下一行注释（约增加 3 KB Flash）
;   -u _printf_float

; ----------------------------------------------------------------------------
;  可选：额外生成 firmware.hex（见 extra_script.py），方便 ST-Link Utility /
;  FlyMcu 等工具烧录。若不需要可注释掉本行。
; ----------------------------------------------------------------------------
extra_scripts = extra_script.py

; ----------------------------------------------------------------------------
;  环境 1：Blue Pill / F103C8T6（64 KB Flash + 20 KB RAM）
; ----------------------------------------------------------------------------
[env:bluepill_f103c8]
board = bluepill_f103c8

; ----------------------------------------------------------------------------
;  环境 2：使用 F103C8 的“隐藏”128 KB Flash（C8 与 CB 同晶圆）
;  用法: pio run -e bluepill_f103c8_128k -t upload
; ----------------------------------------------------------------------------
[env:bluepill_f103c8_128k]
board = bluepill_f103c8_128k